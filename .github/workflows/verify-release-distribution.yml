name: Verify release distribution

# Post-publication distribution gate. It re-verifies the live signed catalog
# plane and the backend release mirrors against the just-published release.
# It publishes nothing user-facing; the retired secondary image/formula
# channels used to move after publication but no longer exist.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published latest core tag to re-verify, e.g. v0.1.35"
        required: true
        type: string

concurrency:
  group: verify-release-distribution-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Verify published latest release
    # The public repo also hosts desktop-vX.Y.Z releases. Ignore those release
    # events without painting the repository red; a manual repair still runs
    # and fails closed on an invalid tag.
    if: >-
      ${{
        github.repository == 'chameleon-ai/openasr' &&
        (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
      }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::expected a stable vX.Y.Z release tag, got '$tag'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          release="$(gh api "repos/${{ github.repository }}/releases/tags/${tag}")"
          if [ "$(jq -r .draft <<<"$release")" != "false" ] || [ "$(jq -r .prerelease <<<"$release")" != "false" ]; then
            echo "::error::${tag} is not a published stable release"
            exit 1
          fi
          latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "::error::refusing to move latest channels backwards: ${tag} is not GitHub latest (${latest})"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  distribution-gate:
    name: Re-verify live catalog and backend CDN
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # Helper scripts must come from the live default branch. A release:
      # published event checks out the tag by default, so a later CI-only fix
      # (for example gh_release.py writing progress to stderr) would otherwise
      # be invisible and skip this verification. Release bytes still come from
      # the published tag via download-packs, SHA256SUMS, and the live catalog.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download release trust metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          # A skip-windows release carries no backend packs: derive the
          # download set from the release's own asset list so a half-built
          # matrix fails here instead of passing an empty gate downstream.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^backend-pack-.*\.json$'; then
            pack_args=()
          else
            pack_args=(--skip-windows)
          fi
          python3 tooling/release-manifest/gh_release.py download-packs \
            "$TAG" release-metadata "${pack_args[@]}"
      - name: Require the finalizer's live distribution invariants
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(release-metadata/backend-pack-*.json)
          cuda_entries=(release-metadata/backend-pack-cuda-sm_*.json)
          hip_entries=(release-metadata/backend-pack-hip-gfx*.json)
          vulkan_entries=(release-metadata/backend-pack-vulkan-generic.json)
          if [ "${#entries[@]}" -eq 0 ]; then
            # Skip-windows release: no backend packs were published. The live
            # catalog gate below still runs; only the backend-pack checks are
            # vacuous. Anything in between zero and the full set fails closed.
            echo "::notice::release carries no backend packs (skip-windows): skipping backend distribution checks"
          else
            if [ "${#entries[@]}" -ne 21 ] || [ "${#cuda_entries[@]}" -ne 6 ] || [ "${#hip_entries[@]}" -ne 14 ] || [ "${#vulkan_entries[@]}" -ne 1 ]; then
              echo "::error::release must contain exactly 1 Vulkan, 6 CUDA, and 14 HIP backend-pack metadata files"
              exit 1
            fi
          fi
          entry_args=()
          for entry in "${entries[@]}"; do entry_args+=(--entry "$entry"); done
          if [ "${#entries[@]}" -eq 0 ]; then
            have_backends=false
          else
            have_backends=true
          fi
          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL "https://catalog.openasr.org/v1/catalog.json?channels=${cache_bust}" -o catalog.json
          curl -fsSL "https://catalog.openasr.org/v1/catalog.signature.json?channels=${cache_bust}" -o catalog.signature.json
          # Exercise the live pair through the currently-shipping CLI. This is
          # the same runtime Ed25519/epoch/registry gate deploy-catalog uses,
          # not merely a comparison against self-declared signature metadata.
          scripts/gate-catalog-against-released-binary.sh \
            catalog.json catalog.signature.json
          python3 - <<'PY'
          import hashlib, json
          raw = open("catalog.json", "rb").read()
          sig = json.load(open("catalog.signature.json", encoding="utf-8"))
          assert hashlib.sha256(raw).hexdigest() == sig["catalog_sha256"], "live catalog sha256 does not match its signature record"
          assert sig["catalog_url"] == "https://catalog.openasr.org/v1/catalog.json", "live catalog has a non-canonical signed identity"
          PY
          if [ "$have_backends" = "true" ]; then
            python3 tooling/release-manifest/backend_catalog.py verify-catalog \
              --catalog catalog.json "${entry_args[@]}"
            python3 tooling/release-manifest/backend_hardware_evidence.py \
              "${entry_args[@]}" \
              --catalog catalog.json --version "$VERSION" >/dev/null
            python3 tooling/release-manifest/backend_catalog.py verify-mirrors \
              --catalog catalog.json --version "$VERSION"
          else
            # No new entries exist to verify against (the --entry CLIs require
            # at least one), so assert the live catalog shape directly: it must
            # parse with a backends list (carried forward from the last full
            # release). verify-mirrors still probes the release mirrors that
            # list names (all carried-forward versions, so no --version filter).
            python3 - catalog.json <<'PY'
          import json
          import sys
          from pathlib import Path

          live = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(live.get("backends"), list):
              raise SystemExit("live catalog backends must be an array")
          PY
            python3 tooling/release-manifest/backend_catalog.py verify-mirrors \
              --catalog catalog.json
          fi
