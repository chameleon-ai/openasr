tagline = "NVIDIA Nemotron 3.5 Transcribe — a 30B MoE speech LLM for long-form, multilingual transcription with speaker attribution"

highlights = [
  "🗣️ **40 languages** — long-form recordings up to 1 hour, verbatim punctuated output",
  "👥 **Speaker attribution** — Sortformer branch and CTC timestamp head ship inside every pack",
  "📦 **Three quant tiers** — ad_q2_0_m (default) / ad_iq4_nl / q8_0 in OpenASR's native .oasr format",
  "✅ **Runs offline in OpenASR** — the native runtime executes the full pipeline (PE encoder + hybrid Mamba-2/MoE decoder + speaker branch) from one .oasr pack; the JFK fixture transcribes verbatim on GPU (HIP) and CPU",
]

intro = """
Nemotron 3.5 Transcribe 30B-A4B is NVIDIA's open-weight offline speech LLM.
Its Mamba-2/Transformer/MoE decoder (nemotron_h_moe, 53 blocks) reads a
32-layer PE ASR encoder, with a 31-layer Sortformer branch for speaker
attribution and a CTC head for word timestamps — all in one merged `.oasr`
pack. OpenASR distributes the three published quantization tiers (q8_0,
ad_iq4_nl, ad_q2_0_m) in the native `.oasr` format, and the OpenASR native
runtime executes the full offline pipeline (mel frontend, PE encoder, hybrid
Mamba-2/Transformer/MoE decoder, speaker branch) from a single pack. Verified
verbatim on the JFK fixture on GPU (ROCm/HIP) and CPU; long-form and
multi-speaker validation is ongoing.
"""

